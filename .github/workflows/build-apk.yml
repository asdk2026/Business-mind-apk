name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BusinessMind-v1.0.7.apk
          ls -lh release-output/BusinessMind-v1.0.7.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMind-v1.0.7-APK
          path: release-output/BusinessMind-v1.0.7.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.7
          name: "Business Mind v1.0.7 (Local SQLite Engine + Offline PIN + Conflict & Auto Recovery)"
          body: |
            ## Business Mind - Official Android APK Release v1.0.7
            
            Complete Offline-First SQLite Architecture Upgrade for **pwa-7900d**:
            
            ### What's New in v1.0.7:
            - **Local SQLite Database (`sql.js` WASM + IndexedDB Persistence)**: Reliable relational SQLite storage for products, customers, suppliers, invoices, purchases, stock movements, payments, expenses, and KV state.
            - **Offline Login & PIN Unlock**: Secure salted SHA-256 Offline PIN + Cached Session Unlock when offline or screen locked.
            - **True Background Sync & Record Conflict Handling**: Persistent SQLite `sync_queue` with Background Sync registration, automatic reconnect flush, `version` + `updated_at` conflict resolution, and Conflict Resolution Log.
            - **Rolling Auto-Backups & Data Recovery Center**: Automatic rolling SQLite snapshots with 1-click Restore plus `.sqlite` binary & `.json` export/import.
            - **Local Image Cache**: Offline product thumbnail cache in SQLite `image_cache` + Browser CacheStorage + Workbox.
            
            ### Installation:
            Download and install `BusinessMind-v1.0.7.apk` on any Android device (Android 7.0+).
          files: release-output/BusinessMind-v1.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
