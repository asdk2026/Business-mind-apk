name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BusinessMind-v1.0.6.apk
          ls -lh release-output/BusinessMind-v1.0.6.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMind-v1.0.6-APK
          path: release-output/BusinessMind-v1.0.6.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.6
          name: "Business Mind v1.0.6 (Full Offline Mode + Auto Data Restore)"
          body: |
            ## Business Mind - Official Android APK Release v1.0.6
            
            **Business Mind** Retail Business Management System with True Offline-First Operation, Dual-Layer Persistence, and Full Cloud Restore across Updates.
            
            ### Fixes & Enhancements in v1.0.6:
            - **True Offline Mode**: Enabled Firestore persistent IndexedDB cache, cached Firebase Auth profile offline fallback, and offline Workbox PWA caching so the app opens and operates completely offline without logging users out.
            - **Auto Data Restore Across Updates**: Added IndexedDB local mirror hydration plus full 10-collection chunked Firestore sync & automatic restore on login/update, plus automatic queue flush when reconnecting online.
            - **Firebase Hosting & Rules Ready**: Updated `firestore.rules` for `purchases`, `stock_movements`, and `payments` on project `pwa-7900d`.
            
            ### Installation:
            Download and install `BusinessMind-v1.0.6.apk` on any Android device (Android 7.0+).
          files: release-output/BusinessMind-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
