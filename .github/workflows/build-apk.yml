name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BusinessMind-v1.0.8.apk
          ls -lh release-output/BusinessMind-v1.0.8.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMind-v1.0.8-APK
          path: release-output/BusinessMind-v1.0.8.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.8
          name: "Business Mind v1.0.8 (Instant Offline Boot + Local SQLite + Offline PIN)"
          body: |
            ## Business Mind - Official Android APK Release v1.0.8
            
            Offline-First SQLite Architecture & Instant Offline Boot Fix for **pwa-7900d**:
            
            ### What's New in v1.0.8:
            - **Instant Offline Boot & Watchdog Fallback**: Fixed an issue where launching the app offline or on dead Wi-Fi could wait indefinitely on `"Verifying Firebase session & access permissions..."`. Now opens immediately into Cached Session / Offline PIN unlock using Local SQLite.
            - **Fast Firestore Timeout Guard**: Added 2.5s timeout fallback on Firebase profile verification so slow/stalled mobile connections gracefully fall back to cached credentials.
            - **Full v1.0.7 Offline Suite Included**: Local SQLite (`sql.js` WASM + IndexedDB), Rolling Auto-Backups, Background Sync Queue, Record Conflict Handling, Offline Invoices & Stock, 100% Local Reports, and Local Image Cache.
            
            ### Installation:
            Download and install `BusinessMind-v1.0.8.apk` on any Android device (Android 7.0+).
          files: release-output/BusinessMind-v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
